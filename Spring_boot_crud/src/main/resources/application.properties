server.port=8081
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productoscruddb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
